[project]
name = "performance-rnn-torch"
version = "2.0.0"
description = "Performance RNN in PyTorch: expressive piano performances with timing and dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessandro Anatrini" }]
keywords = ["music generation", "midi", "rnn", "pytorch", "performance-rnn"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "pretty-midi>=0.2.10",
    "torch>=2.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.17"]
optimize = ["optuna>=4.0"]

[project.scripts]
prnn = "performance_rnn_torch.cli:main"

[project.urls]
Repository = "https://github.com/anatrini/performance_rnn_torch"
Issues = "https://github.com/anatrini/performance_rnn_torch/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E731"]   # small lambdas in tests read well
